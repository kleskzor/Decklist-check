<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>MTG Decklist Checker Pro v12</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #ffffff;
            --accent-color: #3d5afe;
            --border-color: #333;
            --success-color: #4caf50;
            --danger-color: #b71c1c;
            --highlight-color: #5c6bc0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
        }
        header {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: #000; display: flex; align-items: center; padding: 0 20px;
            z-index: 100; border-bottom: 1px solid var(--border-color); justify-content: space-between;
        }
        #sidebar { width: 300px; margin-top: 60px; background: #151515; overflow-y: auto; border-right: 1px solid var(--border-color); }
        #main { flex: 1; margin-top: 60px; overflow-y: auto; padding: 20px; }
        
        /* Stats Dashboard */
        .stats-bar { display: flex; gap: 25px; background: #1a1a1a; padding: 8px 20px; border-radius: 8px; border: 1px solid var(--border-color); align-items: center; }
        .stat-item { display: flex; flex-direction: column; align-items: center; }
        .stat-value { font-size: 1.2rem; font-weight: bold; line-height: 1; }
        .stat-label { font-size: 0.65rem; text-transform: uppercase; opacity: 0.6; margin-top: 4px; }

        /* Search */
        .search-container { margin-bottom: 20px; position: relative; max-width: 500px; }
        #cardSearch { width: 100%; padding: 12px; background: #222; border: 1px solid var(--border-color); color: white; border-radius: 5px; font-size: 1rem; outline: none; }
        #cardSearch:focus { border-color: var(--accent-color); }
        .autocomplete-results { position: absolute; top: 100%; left: 0; right: 0; background: #222; border: 1px solid #444; border-top: none; border-radius: 0 0 5px 5px; z-index: 1000; max-height: 300px; overflow-y: auto; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .autocomplete-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .autocomplete-item.highlighted { background-color: var(--highlight-color); color: white; }

        /* Card Visuals */
        .deck-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-top: 20px; }
        .card-container { position: relative; background: #1e1e1e; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 300px; }
        .card-image-wrapper { position: relative; width: 100%; padding-top: 139%; /* MTG card ratio */ background: #111; cursor: pointer; }
        .card-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        /* Placeholder box pro nenačtené karty */
        .card-placeholder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            padding: 15px; box-sizing: border-box; text-align: center;
            background: linear-gradient(45deg, #111, #222);
            color: #888; font-weight: bold; font-size: 0.9rem;
        }

        .card-container.done { opacity: 0.15; filter: grayscale(100%); }
        .card-controls { display: flex; justify-content: space-around; align-items: center; padding: 8px; background: #252525; }
        .count-badge { font-weight: bold; font-size: 1.1rem; }
        .btn-ctrl { background: #444; border: none; color: white; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
        .btn-plus { color: var(--success-color); font-weight: bold; }
        .btn-reset { background: var(--danger-color); color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn-check-all { background: var(--success-color); color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }

        .player-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .player-item.active { background: var(--accent-color); }
        .player-item.is-done { opacity: 0.5; background: #0a0a0a; }

        @media (max-width: 1600px) { .deck-grid { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; font-size: 1.2rem;">MTG Deck Checker Pro v12</div>
    <input type="file" id="fileInput" accept=".csv">
</header>

<div id="sidebar">
    <div style="padding: 20px; opacity: 0.5; text-align: center;">Nahrajte CSV soubor...</div>
</div>

<div id="main">
    <div id="deckInfo"></div>
    <div id="searchArea"></div>
    <div id="deckGrid" class="deck-grid"></div>
</div>

<script>
    let players = [];
    let currentSelectedName = null;
    let highlightedIndex = -1;

    // --- DB & IMAGE LOGIC ---
    const dbName = "MTGImageCache";
    const storeName = "images";
    const delay = (ms) => new Promise(res => setTimeout(res, ms));

    function initDB() {
        return new Promise((resolve) => {
            const request = indexedDB.open(dbName, 1);
            request.onupgradeneeded = (e) => e.target.result.createObjectStore(storeName);
            request.onsuccess = (e) => resolve(e.target.result);
        });
    }

    async function getSmartImage(cardName, imgElement, placeholderElement) {
        const db = await initDB();
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const getReq = store.get(cardName);

        getReq.onsuccess = async () => {
            if (getReq.result) {
                imgElement.src = URL.createObjectURL(getReq.result);
                imgElement.onload = () => placeholderElement.style.display = "none";
            } else {
                // Přidáme malou prodlevu, abychom nespamovali Scryfall (prevence Error 429)
                await delay(100); 
                const scryfallUrl = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(cardName)}&format=image&version=normal`;
                
                try {
                    const response = await fetch(scryfallUrl);
                    if (!response.ok) throw new Error("Scryfall limit");
                    const blob = await response.blob();
                    
                    const saveTx = db.transaction(storeName, "readwrite");
                    saveTx.objectStore(storeName).put(blob, cardName);
                    
                    imgElement.src = URL.createObjectURL(blob);
                    imgElement.onload = () => placeholderElement.style.display = "none";
                } catch (err) {
                    console.warn("CORS nebo RateLimit - zkouším přímé zobrazení bez uložení:", cardName);
                    // Fallback: Pokud selže fetch (CORS), zkusíme to vložit přímo do SRC. 
                    // Prohlížeč obrázek zobrazí, ale my ho nebudeme moct uložit do DB.
                    imgElement.src = scryfallUrl;
                    imgElement.onload = () => placeholderElement.style.display = "none";
                    imgElement.onerror = () => {
                        placeholderElement.innerHTML = `⚠️<br>${cardName}`;
                        placeholderElement.style.color = "#ff5252";
                    };
                }
            }
        };
    }

    // --- CSV PARSING ---
    document.getElementById('fileInput').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => parseCSV(evt.target.result);
        reader.readAsText(file);
    });

    function parseCSV(text) {
        const rows = [];
        let row = []; let field = ""; let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (inQuotes) {
                if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; } else field += c;
            } else {
                if (c === '"') inQuotes = true;
                else if (c === ',') { row.push(field); field = ""; }
                else if (c === '\n' || c === '\r') {
                    if (field || row.length > 0) { row.push(field); rows.push(row); }
                    row = []; field = ""; if (c === '\r' && text[i+1] === '\n') i++;
                } else field += c;
            }
        }
        if (field || row.length > 0) { row.push(field); rows.push(row); }

        const header = rows[0].map(h => h.trim());
        const fIdx = header.indexOf('first_name');
        const lIdx = header.indexOf('last_name');
        const listIdx = header.indexOf('plaintext_list');
        const archIdx = header.indexOf('archetype');

        players = rows.slice(1).map(r => {
            const name = `${r[fIdx]} ${r[lIdx]}`.trim();
            const list = r[listIdx] || "";
            let arch = r[archIdx] || "";
            let cards = [];
            list.split('\n').forEach(line => {
                const lineTrim = line.trim();
                if (!lineTrim || lineTrim.includes("SIDEBOARD:")) return;
                const match = lineTrim.match(/^(\d+)\s+(.+)$/);
                if (match) cards.push({ count: parseInt(match[1]), current: parseInt(match[1]), name: match[2] });
                else cards.push({ count: 1, current: 1, name: lineTrim });
            });
            cards.sort((a, b) => a.name.localeCompare(b.name));
            return { name, arch, cards };
        }).filter(p => p.name);
        players.sort((a, b) => a.name.localeCompare(b.name));
        renderSidebar();
    }

    function isPlayerDone(p) { return p.cards.length > 0 && p.cards.every(c => c.current === 0); }

    function renderSidebar() {
        const sb = document.getElementById('sidebar');
        sb.innerHTML = "";
        const pending = players.filter(p => !isPlayerDone(p));
        const completed = players.filter(p => isPlayerDone(p));

        const renderList = (list, isCompleted) => {
            list.forEach(p => {
                const div = document.createElement('div');
                div.className = `player-item ${currentSelectedName === p.name ? 'active' : ''} ${isCompleted ? 'is-done' : ''}`;
                div.innerHTML = `<div><strong>${p.name}</strong><br><small style="opacity:0.7">${p.arch || 'Deck'}</small></div>${isCompleted ? '<span>✅</span>' : ''}`;
                div.onclick = () => { currentSelectedName = p.name; renderDeck(); renderSidebar(); };
                sb.appendChild(div);
            });
        };
        renderList(pending, false);
        if (completed.length > 0) {
            const sep = document.createElement('div');
            sep.style = "padding: 10px; background: #000; font-size: 0.7rem; color: #555; text-align: center;";
            sep.textContent = "ZKONTROLOVÁNO";
            sb.appendChild(sep);
            renderList(completed, true);
        }
    }

    function renderDeck() {
        if (!currentSelectedName) return;
        const p = players.find(p => p.name === currentSelectedName);
        const info = document.getElementById('deckInfo');
        const searchArea = document.getElementById('searchArea');
        const grid = document.getElementById('deckGrid');
        
        const total = p.cards.reduce((sum, c) => sum + c.count, 0);
        const remaining = p.cards.reduce((sum, c) => sum + c.current, 0);
        const done = total - remaining;

        info.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px; gap: 20px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 200px;">
                    <h1 style="margin:0; font-size: 1.8rem;">${p.name}</h1>
                    <div style="font-size:1rem; color:var(--accent-color);">${p.arch}</div>
                </div>
                <div class="stats-bar">
                    <div class="stat-item"><span class="stat-value">${total}</span><span class="stat-label">Celkem</span></div>
                    <div class="stat-item" style="color: var(--success-color)"><span class="stat-value">${done}</span><span class="stat-label">Ověřeno</span></div>
                    <div class="stat-item" style="color: ${remaining > 0 ? 'orange' : 'var(--success-color)'}"><span class="stat-value">${remaining}</span><span class="stat-label">Zbývá</span></div>
                </div>
                <div style="display:flex; gap: 8px;">
                    <button class="btn-check-all" onclick="checkAllCards()">Ověřit vše</button>
                    <button class="btn-reset" onclick="resetDeck()">Reset</button>
                </div>
            </div>
        `;

        searchArea.innerHTML = `<div class="search-container"><input type="text" id="cardSearch" placeholder="Hledat kartu..." autocomplete="off"><div id="autocompleteResults" class="autocomplete-results"></div></div>`;
        setupSearch();

        grid.innerHTML = "";
        const cardsWithIdx = p.cards.map((c, i) => ({...c, originalIdx: i}));
        const displayCards = [...cardsWithIdx.filter(c => c.current > 0), ...cardsWithIdx.filter(c => c.current === 0)];

        displayCards.forEach((card) => {
            const container = document.createElement('div');
            container.className = `card-container ${card.current === 0 ? 'done' : ''}`;
            
            // Image Wrapper
            const wrapper = document.createElement('div');
            wrapper.className = 'card-image-wrapper';
            wrapper.onclick = () => updateCard(card.originalIdx, -1);

            // Placeholder s textem
            const placeholder = document.createElement('div');
            placeholder.className = 'card-placeholder';
            placeholder.textContent = card.name;

            // Samotný obrázek
            const img = document.createElement('img');
            img.className = 'card-image';
            img.alt = card.name;

            getSmartImage(card.name, img, placeholder);

            wrapper.appendChild(placeholder);
            wrapper.appendChild(img);
            
            const ctrl = document.createElement('div');
            ctrl.className = 'card-controls';
            ctrl.innerHTML = `
                <button class="btn-ctrl" onclick="updateCard(${card.originalIdx}, -1)">-</button>
                <div class="count-badge">${card.current}</div>
                <button class="btn-ctrl btn-plus" onclick="updateCard(${card.originalIdx}, 1)">+</button>
            `;
            
            container.appendChild(wrapper);
            container.appendChild(ctrl);
            grid.appendChild(container);
        });
    }

    // --- SEARCH LOGIC ---
    function setupSearch() {
        const input = document.getElementById('cardSearch');
        const resultsDiv = document.getElementById('autocompleteResults');
        const p = players.find(p => p.name === currentSelectedName);
        let matches = [];

        input.addEventListener('input', () => {
            const val = input.value.toLowerCase();
            highlightedIndex = -1;
            if (val.length < 2) { resultsDiv.style.display = "none"; return; }
            matches = p.cards.map((c, i) => ({...c, idx: i})).filter(c => c.name.toLowerCase().includes(val) && c.current > 0);
            
            resultsDiv.innerHTML = "";
            if (matches.length > 0) {
                resultsDiv.style.display = "block";
                matches.forEach((m, i) => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.innerHTML = `<span>${m.name}</span> <span style="opacity:0.5">${m.current}x</span>`;
                    div.onclick = () => selectMatch(m);
                    resultsDiv.appendChild(div);
                });
            } else resultsDiv.style.display = "none";
        });

        input.addEventListener('keydown', (e) => {
            const items = resultsDiv.getElementsByClassName('autocomplete-item');
            if (e.key === 'ArrowDown') { e.preventDefault(); highlightedIndex = (highlightedIndex + 1) % items.length; updateHighlight(items); } 
            else if (e.key === 'ArrowUp') { e.preventDefault(); highlightedIndex = (highlightedIndex - 1 + items.length) % items.length; updateHighlight(items); } 
            else if (e.key === 'Enter') {
                e.preventDefault();
                if (highlightedIndex > -1) selectMatch(matches[highlightedIndex]);
                else if (matches.length === 1) selectMatch(matches[0]);
            }
        });

        function updateHighlight(items) {
            Array.from(items).forEach((it, i) => it.classList.toggle('highlighted', i === highlightedIndex));
        }

        function selectMatch(m) {
            updateCard(m.idx, -1);
            input.value = "";
            resultsDiv.style.display = "none";
            input.focus();
        }
    }

    window.updateCard = (idx, delta) => {
        const p = players.find(p => p.name === currentSelectedName);
        const c = p.cards[idx];
        c.current = Math.max(0, Math.min(c.count, c.current + delta));
        renderDeck();
        renderSidebar();
        if (document.getElementById('cardSearch')) document.getElementById('cardSearch').focus();
    };

    window.resetDeck = () => {
        const p = players.find(p => p.name === currentSelectedName);
        p.cards.forEach(c => c.current = c.count);
        renderDeck(); renderSidebar();
    };

    window.checkAllCards = () => {
        const p = players.find(p => p.name === currentSelectedName);
        p.cards.forEach(c => c.current = 0);
        renderDeck(); renderSidebar();
    };
</script>

</body>
</html>

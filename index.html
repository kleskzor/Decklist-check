<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>MTG Decklist Checker Pro</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #ffffff;
            --accent-color: #3d5afe;
            --border-color: #333;
            --success-color: #4caf50;
            --danger-color: #b71c1c;
            --highlight-color: #5c6bc0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
        }
        header {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: #000; display: flex; align-items: center; padding: 0 20px;
            z-index: 100; border-bottom: 1px solid var(--border-color); justify-content: space-between;
        }
        #sidebar { width: 300px; margin-top: 60px; background: #151515; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        #main { flex: 1; margin-top: 60px; overflow-y: auto; padding: 20px; }
        
        /* Stats Dashboard */
        .stats-bar { display: flex; gap: 25px; background: #1a1a1a; padding: 8px 20px; border-radius: 8px; border: 1px solid var(--border-color); align-items: center; }
        .stat-item { display: flex; flex-direction: column; align-items: center; }
        .stat-value { font-size: 1.2rem; font-weight: bold; line-height: 1; }
        .stat-label { font-size: 0.65rem; text-transform: uppercase; opacity: 0.6; margin-top: 4px; }

        /* Search */
        .search-container { margin-bottom: 20px; position: relative; max-width: 500px; }
        #cardSearch { width: 100%; padding: 12px; background: #222; border: 1px solid var(--border-color); color: white; border-radius: 5px; font-size: 1rem; outline: none; }
        #cardSearch:focus { border-color: var(--accent-color); }
        .autocomplete-results { position: absolute; top: 100%; left: 0; right: 0; background: #222; border: 1px solid #444; border-top: none; border-radius: 0 0 5px 5px; z-index: 1000; max-height: 300px; overflow-y: auto; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .autocomplete-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .autocomplete-item.highlighted { background-color: var(--highlight-color); color: white; }

        /* Card Visuals */
        .deck-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-top: 20px; }
        .card-container { position: relative; background: #1e1e1e; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 300px; }
        .card-image-wrapper { position: relative; width: 100%; padding-top: 139%; /* MTG card ratio */ background: #111; cursor: pointer; }
        .card-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        /* Placeholder box pro nenačtené karty */
        .card-placeholder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            padding: 15px; box-sizing: border-box; text-align: center;
            background: linear-gradient(45deg, #111, #222);
            color: #888; font-weight: bold; font-size: 0.9rem;
        }

        .card-container.done { opacity: 0.15; filter: grayscale(100%); }
        .card-controls { display: flex; justify-content: space-around; align-items: center; padding: 8px; background: #252525; }
        .count-badge { font-weight: bold; font-size: 1.1rem; }
        .btn-ctrl { background: #444; border: none; color: white; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
        .btn-plus { color: var(--success-color); font-weight: bold; }
        .btn-reset { background: var(--danger-color); color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn-check-all { background: var(--success-color); color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }

        .player-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .player-item.active { background: var(--accent-color); }
        .player-item.is-done { opacity: 0.5; background: #0a0a0a; }

        .dropdown-menu { display: none; position: absolute; right: 0; top: 50px; background: #222; border: 1px solid #444; border-radius: 5px; z-index: 200; min-width: 200px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .menu-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #333; transition: background 0.2s; }
        .menu-item:hover { background: #333; }
        .menu-item:last-child { border-bottom: none; }

        /* Modal & Sidebar Footer */
        #playerList { flex: 1; overflow-y: auto; }
        .sidebar-footer { padding: 10px; border-top: 1px solid var(--border-color); background: #151515; }
        .btn-add-deck { width: 100%; padding: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; transition: background 0.2s; font-weight: bold; }
        .btn-add-deck:hover { background: #444; }

        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.7); }
        .modal-content { background-color: #222; margin: 5% auto; padding: 20px; border: 1px solid #444; width: 600px; max-width: 90%; color: white; border-radius: 8px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .close-modal { color: #aaa; float: right; font-size: 28px; font-weight: bold; align-self: flex-end; cursor: pointer; line-height: 1; }
        .close-modal:hover { color: white; }
        .modal-input { padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; font-family: inherit; }
        .modal-btn { padding: 10px; background: var(--accent-color); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .modal-btn:hover { background: #304ffe; }

        @media (max-width: 1600px) { .deck-grid { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; font-size: 1.2rem;">MTG Deck Checker Pro</div>
    <div style="display: flex; align-items: center; gap: 20px;">
        <div id="headerStats" class="stats-bar" style="display: none; padding: 5px 15px; gap: 15px;"></div>
        <div style="position: relative;">
            <img src="./img/menu_icon.png" alt="Menu" id="menuBtn" style="cursor: pointer; height: 30px;" onclick="toggleMenu(event)">
            <div id="dropdownMenu" class="dropdown-menu">
                <div class="menu-item" onclick="document.getElementById('dropdownMenu').style.display='none'; document.getElementById('fileInput').click()">📂 Nahrát decklisty (CSV)</div>
                <div class="menu-item" onclick="document.getElementById('dropdownMenu').style.display='none'; loadTestData()">🧪 Nahrát testovací data</div>
                <div class="menu-item" onclick="document.getElementById('dropdownMenu').style.display='none'; showMeta()">📊 Tournament Meta</div>
                <div class="menu-item" onclick="document.getElementById('dropdownMenu').style.display='none'; exportTournament()">💾 Uložit turnaj (CSV)</div>
                <div class="menu-item" onclick="document.getElementById('dropdownMenu').style.display='none'; openHowToModal()" data-i18n="menuHowTo">❓ Nápověda</div>
                <div class="menu-item" onclick="document.getElementById('dropdownMenu').style.display='none'; deleteAllPlayers()" style="color: var(--danger-color);">🗑️ Smazat vše</div>
            </div>
        </div>
    </div>
    <input type="file" id="fileInput" accept=".csv" style="display: none;">
</header>

<div id="sidebar">
    <div style="padding: 10px; border-bottom: 1px solid var(--border-color); background: #151515;">
        <input type="text" id="playerSearchInput" placeholder="Hledat hráče..." autocomplete="off" style="width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;">
    </div>
    <div id="playerList">
        <div style="padding: 20px; opacity: 0.5; text-align: center;">Nahrajte CSV soubor...</div>
    </div>
    <div class="sidebar-footer">
        <button class="btn-add-deck" onclick="openAddModal()">+ Přidat decklist</button>
    </div>
</div>

<div id="main">
    <div id="deckInfo"></div>
    <div id="searchArea"></div>
    <div id="deckGrid" class="deck-grid"></div>
</div>

<div id="addDeckModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeAddModal()">&times;</span>
        <h2 style="margin: 0;">Přidat decklist</h2>
        <input type="text" id="newPlayerName" class="modal-input" placeholder="Jméno hráče">
        <input type="text" id="newPlayerArchetype" class="modal-input" placeholder="Archetype / Commander">
        <textarea id="newDecklist" class="modal-input" rows="15" placeholder="1 Island&#10;1 Swamp&#10;1 Command Tower&#10;1 Drown in the Loch&#10;1 Mystic Sanctuary&#10;1 Wishclaw Talisman&#10;1 Ash Barrens&#10;1 Baleful Strix&#10;1 Brainstorm&#10;..."></textarea>
        <button class="modal-btn" onclick="saveNewPlayer()">Uložit</button>
    </div>
</div>

<div id="metaModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeMetaModal()">&times;</span>
        <h2 style="margin: 0;">Tournament Meta</h2>
        <div id="metaList" style="max-height: 400px; overflow-y: auto; margin: 15px 0;"></div>
        <button class="modal-btn" onclick="copyMetaToClipboard()">Zkopírovat do schránky</button>
    </div>
</div>

<div id="exportModal" class="modal">
    <div class="modal-content" style="width: 400px;">
        <span class="close-modal" onclick="closeExportModal()">&times;</span>
        <h2 style="margin: 0;">Export pro MTGTop8</h2>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
            <button class="modal-btn" onclick="copyExportArchetype()">Kopírovat Archetype</button>
            <button class="modal-btn" onclick="copyExportPlayer()">Kopírovat Jméno hráče</button>
            <button class="modal-btn" onclick="copyExportDecklist()">Kopírovat Decklist</button>
        </div>
    </div>
</div>

<div id="howToModal" class="modal">
    <div class="modal-content" style="max-width: 800px;">
        <span class="close-modal" onclick="closeHowToModal()">&times;</span>
        <h2 style="margin: 0 0 15px 0;" data-i18n="modalHowToTitle">Jak používat aplikaci</h2>
        <div style="overflow-y: auto; max-height: 70vh; line-height: 1.6;">
            <h3 data-i18n="htUploadTitle" style="color: var(--accent-color); margin-bottom: 5px;"></h3>
            <p data-i18n="htUploadDesc" style="margin-top: 0; color: #ccc;"></p>
            
            <h3 data-i18n="htAddDeckTitle" style="color: var(--accent-color); margin-bottom: 5px;"></h3>
            <p data-i18n="htAddDeckDesc" style="margin-top: 0; color: #ccc;"></p>
            
            <h3 data-i18n="htCheckTitle" style="color: var(--accent-color); margin-bottom: 5px;"></h3>
            <p data-i18n="htCheckDesc" style="margin-top: 0; color: #ccc;"></p>
            
            <h3 data-i18n="htSearchTitle" style="color: var(--accent-color); margin-bottom: 5px;"></h3>
            <p data-i18n="htSearchDesc" style="margin-top: 0; color: #ccc;"></p>
            
            <h3 data-i18n="htExportTitle" style="color: var(--accent-color); margin-bottom: 5px;"></h3>
            <p data-i18n="htExportDesc" style="margin-top: 0; color: #ccc;"></p>
            
            <h3 data-i18n="htStorageTitle" style="color: var(--accent-color); margin-bottom: 5px;"></h3>
            <p data-i18n="htStorageDesc" style="margin-top: 0; color: #ccc;"></p>
        </div>
    </div>
</div>

<script src="./scripts/state.js"></script>
<script src="./scripts/db.js"></script>
<script src="./scripts/ui.js"></script>
<script src="./scripts/deck_logic.js"></script>
<script src="./scripts/import_export.js"></script>
<script src="./scripts/modals.js"></script>
<script src="./scripts/main.js"></script>

</body>
</html>
